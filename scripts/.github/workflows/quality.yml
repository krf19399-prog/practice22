name: Quality and support
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
 
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
 
      - name: Static analysis
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . --output-format=concise | tee ruff-report.txt
 
      - name: Automated tests
        id: tests
        continue-on-error: true
        run: >
          pytest -v
          --junitxml=test-results.xml
          --cov=helpdesk
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
 
      - name: Create support report
        if: always()
        run: python scripts/make_support_report.py
 
      - name: Upload quality package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-support-package
          path: |
            ruff-report.txt
            test-results.xml
            coverage.xml
            support-report.txt
            VERSION
            CHANGELOG.md
          if-no-files-found: warn
 
      - name: Evaluate quality gate
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Static analysis failed"
            exit 1
          fi
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Automated tests failed"
            exit 1
          fi
          echo "Quality gate passed"
